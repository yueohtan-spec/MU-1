name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Lấy mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Cài đặt các gói phụ thuộc (Dependencies)
        run: |
          npm install

      - name: 5. Khởi tạo và đồng bộ dự án Android bằng Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 6. Tự động chấp nhận chứng chỉ Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 7. Biên dịch file APK bằng Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Tải file APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MU-Idle-Awakening-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
